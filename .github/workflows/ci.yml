name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build plugin (.xpi)
        # Proves the plugin packages cleanly. We deliberately do NOT run
        # `npx zotero-plugin test` in CI: the test runner launches a real
        # Zotero binary (Firefox-based) which is not available on a CI runner.
        # The mocha suite under test/ runs locally / by the maintainer against
        # a live Zotero 9 instance (npm test => zotero-plugin test).
        run: npx zotero-plugin build
